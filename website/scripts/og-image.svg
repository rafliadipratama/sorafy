<!--
  Source for public/og-image.png. Regenerate from website/ after editing:
    magick -background none -density 96 scripts/og-image.svg /tmp/og-base.png
    magick ../shared/assets/logo_monogram.png -resize x210 /tmp/og-logo.png
    magick /tmp/og-base.png /tmp/og-logo.png -geometry +96+150 -composite -strip public/og-image.png
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="glow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00E599" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#00E599" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#00E599" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#07090C"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#00E599"/>

  <!-- Wordmark baseline sits at y=300; logo is composited to its left. -->
  <text x="300" y="300" font-family="Adwaita Sans" font-weight="800" font-size="104"
        letter-spacing="-3" fill="#FFFFFF">sorafy</text>

  <text x="304" y="356" font-family="Adwaita Sans" font-weight="700" font-size="26"
        letter-spacing="4" fill="#00E599">FREE · OPEN SOURCE · NO ADS</text>

  <text x="96" y="452" font-family="Adwaita Sans" font-weight="500" font-size="31"
        fill="#C7CDD4">High-fidelity music streaming with synced lyrics, a 10-band</text>
  <text x="96" y="496" font-family="Adwaita Sans" font-weight="500" font-size="31"
        fill="#C7CDD4">equalizer, and offline downloads. No account, no tracking.</text>

  <rect x="96" y="540" width="1008" height="1" fill="#FFFFFF" fill-opacity="0.09"/>

  <text x="96" y="585" font-family="Adwaita Sans" font-weight="600" font-size="24"
        letter-spacing="1" fill="#7C848E">Windows · macOS · Linux · Android · iOS</text>
  <text x="1104" y="585" text-anchor="end" font-family="Adwaita Sans" font-weight="600"
        font-size="24" letter-spacing="1" fill="#7C848E">GPL-3.0</text>
</svg>
