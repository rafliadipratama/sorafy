name: SoraFy Unified Multiplatform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Build Android APK
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build Android APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sorafy-android-apk
          path: android/app/build/outputs/apk/**/*.apk

  # 2. Build Linux AppImage & Deb (Electron Builder)
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build Linux Desktop Packages
        run: |
          cd desktop
          npm install
          npm run build:linux:all

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sorafy-linux-binaries
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.rpm

  # 3. Build Windows Executable (Electron Builder)
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Windows Desktop Packages
        run: |
          cd desktop
          npm install
          npm run build:win

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sorafy-windows-binaries
          path: |
            desktop/dist/*.exe

  # 4. Build macOS Apple Silicon & Intel DMG (Electron Builder & DMG)
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build macOS DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          cd desktop
          npm install
          npm run build:dmg

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sorafy-macos-dmg
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip

  # 5. Create Unified GitHub Release with All Platforms
  publish-release:
    needs: [build-android, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Organize release assets
        run: |
          mkdir -p final-release
          find release-assets/ -type f -exec cp {} final-release/ \;
          ls -lh final-release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: final-release/*
          draft: false
          prerelease: false
          generate_release_notes: true
